name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style_lint:
    name: Style lint
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up StyLua
        uses: ./.github/actions/setup-env
        with:
          stylua: true

      - name: Check formatting
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: |
          stylua --check lua/ tests/spec/

  test:
    name: Test
    needs: style_lint
    if: >-
      always() &&
      needs.style_lint.result != 'cancelled' &&
      needs.style_lint.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up test environment
        uses: ./.github/actions/setup-env
        with:
          neovim: true
          tree_sitter: true
          test_dependencies: true
          parsers: true

      - name: Run tests
        run: |
          nvim --headless -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/spec/ {minimal_init = 'tests/minimal_init.lua'}"

  create_pr:
    name: Create maintenance PR
    needs: [style_lint, test]
    if: >-
      always() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      ) &&
      needs.style_lint.result == 'success' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      url: ${{ steps.pull_request.outputs.pull-request-url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Set up StyLua
        uses: ./.github/actions/setup-env
        with:
          stylua: true

      - name: Apply formatting
        run: stylua lua/ tests/spec/

      - name: Set up Neovim and EmmyLua documentation generator
        uses: ./.github/actions/setup-env
        with:
          neovim: true
          emmylua_doc: true

      - name: Clean doc directory
        run: |
          mkdir -p doc
          find doc -maxdepth 1 -type f ! -name '*.txt' ! -name 'tags' -delete

      - name: Generate API Markdown from Lua
        run: scripts/generate_api_markdown.sh docs/api

      - name: Generate Vimdocs from Markdown
        uses: ./.github/actions/generate-vimdocs
        with:
          markdown_dir: docs
          vimdoc_prefix: nvim-mybatis
          api_dir: api

      - name: Generate help tags
        run: nvim --headless -c 'helptags doc/' -c 'quit' 2>/dev/null

      - name: Check generated changes
        id: changes
        run: |
          if git status --porcelain --untracked-files=all -- lua/ tests/spec/ docs/api doc | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        id: pull_request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch-token: ${{ github.token }}
          branch: automation/generated-files
          base: main
          delete-branch: true
          add-paths: |
            lua/
            tests/spec/
            docs/api/
            doc/*.txt
            doc/tags
          commit-message: 'chore: update generated files'
          title: 'chore: update generated files'
          body: |
            This pull request was generated by the release workflow.

            It applies StyLua formatting and regenerates the Vim documentation.
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'

  auto_tag:
    name: Auto-tag
    needs: [style_lint, test, create_pr]
    if: >-
      always() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      ) &&
      needs.style_lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.create_pr.result == 'success' &&
      needs.create_pr.outputs.changed == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ github.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Read version
        id: version
        run: |
          git fetch origin main --tags
          VERSION=$(sed -n 's/^local VERSION = "\(.*\)"$/\1/p' lua/nvim-mybatis/version.lua)
          if [ -z "$VERSION" ]; then
            echo "Failed to read version from lua/nvim-mybatis/version.lua" >&2
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [ -z "$latest_tag" ] || ! git diff --quiet "$latest_tag..HEAD" -- lua/nvim-mybatis/version.lua; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_CHANGED: ${{ steps.version.outputs.changed }}
          BRANCH: main
        run: |
          git fetch origin "$BRANCH" --tags
          if [ "$VERSION_CHANGED" != "true" ]; then
            echo "version.lua has not changed since the latest release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists, nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TARGET_SHA=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$TARGET_SHA"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: [style_lint, test, create_pr, auto_tag]
    if: >-
      always() &&
      (
        (
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v')
        ) ||
        (
          (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
          ) &&
          needs.style_lint.result == 'success' &&
          needs.test.result == 'success' &&
          needs.create_pr.result == 'success' &&
          needs.create_pr.outputs.changed == 'false' &&
          needs.auto_tag.result == 'success' &&
          needs.auto_tag.outputs.created == 'true'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ needs.auto_tag.outputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
