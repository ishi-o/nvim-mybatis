name: Setup CI environment
description: Install and cache the tools and dependencies used by CI

inputs:
  stylua:
    description: Install StyLua
    required: false
    default: "false"
  emmylua_doc:
    description: Install EmmyLua documentation generator
    required: false
    default: "false"
  emmylua_doc_version:
    description: EmmyLua documentation generator version
    required: false
    default: "0.25.1"
  pandoc:
    description: Install Pandoc
    required: false
    default: "false"
  pandoc_version:
    description: Pandoc version to install
    required: false
    default: "3.1.11"
  panvimdoc:
    description: Install and cache panvimdoc
    required: false
    default: "false"
  panvimdoc_ref:
    description: panvimdoc ref to install
    required: false
    default: "v4.0.1"
  neovim:
    description: Install the latest stable Neovim
    required: false
    default: "false"
  tree_sitter:
    description: Install the Tree-sitter CLI
    required: false
    default: "false"
  tree_sitter_version:
    description: Tree-sitter CLI version to install
    required: false
    default: "0.25.10"
  test_dependencies:
    description: Clone the test dependencies
    required: false
    default: "false"
  parsers:
    description: Install the Java and XML Tree-sitter parsers
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Pandoc
      if: inputs.pandoc == 'true'
      uses: pandoc/actions/setup@v1
      with:
        version: ${{ inputs.pandoc_version }}

    - name: Cache panvimdoc
      id: panvimdoc_cache
      if: inputs.panvimdoc == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/nvim-mybatis/panvimdoc
        key: panvimdoc-${{ runner.os }}-${{ inputs.panvimdoc_ref }}

    - name: Install panvimdoc
      if: inputs.panvimdoc == 'true' && steps.panvimdoc_cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PANVIMDOC_REF: ${{ inputs.panvimdoc_ref }}
      run: |
        panvimdoc_dir="$HOME/.cache/nvim-mybatis/panvimdoc"
        mkdir -p "$(dirname "$panvimdoc_dir")"
        git clone --depth 1 --branch "$PANVIMDOC_REF" \
          https://github.com/kdheepak/panvimdoc.git \
          "$panvimdoc_dir"

    - name: Resolve StyLua version
      id: stylua_version
      if: inputs.stylua == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version="$(curl -fsSL \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/JohnnyMorganz/StyLua/releases/latest | jq -er '.tag_name')"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache StyLua
      id: stylua_cache
      if: inputs.stylua == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/nvim-mybatis/stylua
        key: stylua-${{ runner.os }}-${{ steps.stylua_version.outputs.version }}

    - name: Install StyLua
      if: inputs.stylua == 'true' && steps.stylua_cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        STYLUA_VERSION: ${{ steps.stylua_version.outputs.version }}
      run: |
        install_dir="$HOME/.cache/nvim-mybatis/stylua"
        mkdir -p "$install_dir"
        curl -fsSL "https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/stylua-linux-x86_64.zip" \
          -o "$RUNNER_TEMP/stylua.zip"
        unzip -j -o "$RUNNER_TEMP/stylua.zip" -d "$install_dir"
        chmod +x "$install_dir/stylua"

    - name: Add StyLua to PATH
      if: inputs.stylua == 'true'
      shell: bash
      run: |
        echo "$HOME/.cache/nvim-mybatis/stylua" >> "$GITHUB_PATH"
        "$HOME/.cache/nvim-mybatis/stylua/stylua" --version

    - name: Cache EmmyLua documentation generator
      id: emmylua_doc_cache
      if: inputs.emmylua_doc == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~/.cargo/bin/emmylua_doc_cli
        key: emmylua-doc-cli-${{ runner.os }}-${{ inputs.emmylua_doc_version }}

    - name: Install EmmyLua documentation generator
      if: inputs.emmylua_doc == 'true' && steps.emmylua_doc_cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        EMMYLUA_DOC_VERSION: ${{ inputs.emmylua_doc_version }}
      run: cargo install --locked emmylua_doc_cli --version "$EMMYLUA_DOC_VERSION"

    - name: Add EmmyLua documentation generator to PATH
      if: inputs.emmylua_doc == 'true'
      shell: bash
      run: |
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        "$HOME/.cargo/bin/emmylua_doc_cli" --version

    - name: Resolve Neovim stable version
      id: neovim_version
      if: inputs.neovim == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version="$(curl -fsSL \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/neovim/neovim/releases/latest | jq -er '.tag_name')"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache Neovim
      id: neovim_cache
      if: inputs.neovim == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/nvim-mybatis/neovim
        key: neovim-${{ runner.os }}-${{ steps.neovim_version.outputs.version }}

    - name: Install Neovim
      if: inputs.neovim == 'true' && steps.neovim_cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        NEOVIM_VERSION: ${{ steps.neovim_version.outputs.version }}
      run: |
        install_dir="$HOME/.cache/nvim-mybatis/neovim"
        mkdir -p "$install_dir"
        curl -fsSL "https://github.com/neovim/neovim/releases/download/${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz" \
          -o "$RUNNER_TEMP/neovim.tar.gz"
        tar -xzf "$RUNNER_TEMP/neovim.tar.gz" --strip-components=1 -C "$install_dir"

    - name: Add Neovim to PATH
      if: inputs.neovim == 'true'
      shell: bash
      run: |
        echo "$HOME/.cache/nvim-mybatis/neovim/bin" >> "$GITHUB_PATH"
        "$HOME/.cache/nvim-mybatis/neovim/bin/nvim" --version | head -n 1

    - name: Cache Tree-sitter CLI
      id: tree_sitter_cache
      if: inputs.tree_sitter == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~/.cargo/bin/tree-sitter
        key: tree-sitter-cli-${{ runner.os }}-${{ inputs.tree_sitter_version }}

    - name: Install Tree-sitter CLI
      if: inputs.tree_sitter == 'true' && steps.tree_sitter_cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TREE_SITTER_VERSION: ${{ inputs.tree_sitter_version }}
      run: cargo install --locked tree-sitter-cli --version "$TREE_SITTER_VERSION"

    - name: Add Tree-sitter CLI to PATH
      if: inputs.tree_sitter == 'true'
      shell: bash
      run: |
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        "$HOME/.cargo/bin/tree-sitter" --version

    - name: Clone test dependencies
      if: inputs.test_dependencies == 'true'
      shell: bash
      run: |
        mkdir -p tests/deps
        git clone --depth 1 https://github.com/nvim-lua/plenary.nvim tests/deps/plenary.nvim
        git clone --depth 1 https://github.com/nvim-treesitter/nvim-treesitter tests/deps/nvim-treesitter

    - name: Resolve nvim-treesitter revision
      id: nvim_treesitter
      if: inputs.parsers == 'true'
      shell: bash
      run: |
        revision="$(git -C tests/deps/nvim-treesitter rev-parse HEAD)"
        echo "revision=$revision" >> "$GITHUB_OUTPUT"

    - name: Cache Tree-sitter parsers
      id: parsers_cache
      if: inputs.parsers == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~/.local/share/nvim/site/parser
        key: nvim-treesitter-parsers-${{ runner.os }}-${{ steps.neovim_version.outputs.version }}-${{ inputs.tree_sitter_version }}-${{ steps.nvim_treesitter.outputs.revision }}

    - name: Install Tree-sitter parsers
      if: inputs.parsers == 'true' && steps.parsers_cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        nvim --headless -u tests/minimal_init.lua \
          -c "lua require('nvim-treesitter').install({ 'java', 'xml' }):wait(300000)" \
          -c "qa!"

    - name: Verify Tree-sitter parsers
      if: inputs.parsers == 'true'
      shell: bash
      run: |
        test -f "$HOME/.local/share/nvim/site/parser/java.so"
        test -f "$HOME/.local/share/nvim/site/parser/xml.so"

    - name: Save StyLua cache
      if: inputs.stylua == 'true' && steps.stylua_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/nvim-mybatis/stylua
        key: ${{ steps.stylua_cache.outputs.cache-primary-key }}

    - name: Save panvimdoc cache
      if: inputs.panvimdoc == 'true' && steps.panvimdoc_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/nvim-mybatis/panvimdoc
        key: ${{ steps.panvimdoc_cache.outputs.cache-primary-key }}

    - name: Save EmmyLua documentation generator cache
      if: inputs.emmylua_doc == 'true' && steps.emmylua_doc_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.cargo/bin/emmylua_doc_cli
        key: ${{ steps.emmylua_doc_cache.outputs.cache-primary-key }}

    - name: Save Neovim cache
      if: inputs.neovim == 'true' && steps.neovim_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/nvim-mybatis/neovim
        key: ${{ steps.neovim_cache.outputs.cache-primary-key }}

    - name: Save Tree-sitter CLI cache
      if: inputs.tree_sitter == 'true' && steps.tree_sitter_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.cargo/bin/tree-sitter
        key: ${{ steps.tree_sitter_cache.outputs.cache-primary-key }}

    - name: Save Tree-sitter parsers cache
      if: inputs.parsers == 'true' && steps.parsers_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.local/share/nvim/site/parser
        key: ${{ steps.parsers_cache.outputs.cache-primary-key }}
